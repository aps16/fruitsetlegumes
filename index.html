<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruits et légumes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one big colour-coded card, tinted by the fruit or vegetable shown; two round arrows below. */
:root {
  --bg: #fff8ee;
  --card: #ffffff;
  --ink: #2b2140;
  --muted: #7a6f8f;
  --out: #3a2a4d;
  --c: #ef476f;
  --c-ink: #ffffff;
  --arrow: #2b2140;
  --arrow-ink: #ffffff;
  --focus: #1b6ef3;
  --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1730; --card: #2a2145; --ink: #fdf3e4; --muted: #b3a8cc; --out: #14101f;
    --arrow: #fdf3e4; --arrow-ink: #1d1730; --focus: #8bb8ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1730; --card: #2a2145; --ink: #fdf3e4; --muted: #b3a8cc; --out: #14101f;
  --arrow: #fdf3e4; --arrow-ink: #1d1730; --focus: #8bb8ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background: color-mix(in srgb, var(--c) 16%, var(--bg));
  color: var(--ink); font-family: var(--font); min-height: 100%;
  padding-block: 18px 26px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .4s;
}
main { max-width: 440px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 10px; border-radius: 99px; background: var(--card); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width .35s, background-color .35s; }
.count { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.6em; text-align: right; }

.scene { perspective: 1200px; }
.card { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1.08; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.card:focus-visible { outline: 4px solid var(--focus); outline-offset: 5px; border-radius: 36px; }
.inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,1.3,.5,1); }
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 36px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 22px;
  box-shadow: 0 10px 0 color-mix(in srgb, var(--c) 55%, #000 0%);
}
.front { background: var(--card); background: color-mix(in srgb, var(--c) 22%, var(--card)); border: 6px solid var(--c); }
.back { background: var(--c); color: var(--c-ink); transform: rotateY(180deg); border: 6px solid var(--c); }
#pic { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; }
#pic svg { height: 100%; max-width: 100%; animation: pop .45s cubic-bezier(.3,1.5,.5,1); }
@keyframes pop { from { transform: scale(.7) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
.word { font-weight: 600; font-size: clamp(2.6rem, 14vw, 3.9rem); line-height: 1.05; text-align: center; overflow-wrap: anywhere; }
.word .art { font-weight: 500; opacity: .75; }
.say {
  width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--c-ink); color: var(--c);
}
.say:focus-visible, .arrow:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.say svg { width: 38px; height: 38px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.arrow {
  width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--arrow); color: var(--arrow-ink); box-shadow: 0 6px 0 rgba(0,0,0,.18);
}
.arrow:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.arrow svg { width: 36px; height: 36px; }
.tip { color: var(--muted); font-weight: 500; text-align: center; flex: 1; min-width: 0; font-size: 1rem; }
.o { stroke: var(--out); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
@media (prefers-reduced-motion: reduce) {
  .inner, .bar i, body { transition: none; }
  #pic svg { animation: none; }
}
</style>

</head>
<body>
<main>
  <div class="top">
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <div class="scene">
    <button class="card" id="card" type="button" aria-label="Retourner la carte">
      <div class="inner">
        <div class="face front"><div id="pic" role="img" aria-label="Image à deviner"></div></div>
        <div class="face back">
          <div class="word" id="word"></div>
          <span class="say" id="say" role="button" tabindex="0" aria-label="Écouter le mot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          </span>
        </div>
      </div>
    </button>
  </div>

  <div class="nav">
    <button class="arrow" id="prev" type="button" aria-label="Carte précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="tip" id="tip">Touche la carte</span>
    <button class="arrow" id="next" type="button" aria-label="Carte suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</main>

    ['concombre', 'le',  'concombre',     'le concombre',    '#2d9a4a', L],
    ['poivron',   'le',  'poivron',       'le poivron',      '#40916c', L],
    ['aubergine', 'l’',  'aubergine',     'l’aubergine',     '#5a189a', L],
    ['brocoli',   'le',  'brocoli',       'le brocoli',      '#2d6a4f', L],
    ['mais',      'le',  'maïs',          'le maïs',         '#ffcb05', Dk]
  ];

  var pos = 0, flipped = false;
  var $ = function (id) { return document.getElementById(id); };
  var card = $('card'), pic = $('pic'), wordEl = $('word'), root = document.documentElement;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- sound ---------- */
  var synth = window.speechSynthesis, voice = null;
  function pickVoice() {
    if (!synth) return;
    var v = synth.getVoices() || [];
    voice = v.filter(function (x) { return /^fr[-_]FR/i.test(x.lang); })[0] || v.filter(function (x) { return /^fr/i.test(x.lang); })[0] || null;
  }
  if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); }
  function speak() {
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') return;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance(CARDS[pos][3]);
      u.lang = (voice && voice.lang) || 'fr-FR';
      if (voice) u.voice = voice;
      u.rate = 0.8;
      synth.speak(u);
    } catch (e) {}
  }

  /* ---------- render ---------- */
  function setBack() {
    var d = CARDS[pos];
    wordEl.innerHTML = '<span class="art">' + d[1] + (d[1].slice(-1) === '’' ? '' : ' ') + '</span>' + d[2];
  }
  function render(keepBack) {
    var d = CARDS[pos];
    root.style.setProperty('--c', d[4]);
    root.style.setProperty('--c-ink', d[5]);
    pic.innerHTML = '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + D[d[0]]() + '</svg>';
    $('count').textContent = (pos + 1) + ' / ' + CARDS.length;
    $('fill').style.width = ((pos + 1) / CARDS.length * 100) + '%';
    if (keepBack) setBack(); else setTimeout(setBack, reduce ? 0 : 340);
  }
  function setFlipped(f, sound) {
    flipped = f;
    card.classList.toggle('flipped', f);
    $('tip').textContent = f ? 'Écoute et répète' : 'Touche la carte';
    if (f && sound) speak();
    if (!f && synth) { try { synth.cancel(); } catch (e) {} }
  }
  function go(n) {
    var was = flipped;
    pos = (n + CARDS.length) % CARDS.length;
    setFlipped(false, false);
    render(!was);
  }

  card.addEventListener('click', function () { setFlipped(!flipped, true); });
  var say = $('say');
  say.addEventListener('click', function (e) { e.stopPropagation(); speak(); });
  say.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); speak(); } });
  $('next').addEventListener('click', function () { go(pos + 1); });
  $('prev').addEventListener('click', function () { go(pos - 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(pos + 1);
    else if (e.key === 'ArrowLeft') go(pos - 1);
  });
  render(true);
})();
</script>
</body>
</html>
